<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動物診断</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
    crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar site-header">
    <div class="container">
      <span class="navbar-brand mb-0">動物診断</span>
    </div>
  </header>

  <main class="container diagnosis-main py-4 py-sm-5">
    <h1 class="h2 mb-3">あなたのいいところは？</h1>
    <form id="diagnosis-form">
      <label class="form-label" for="animal">好きな動物の名前を一つ入力してください。</label>
      <div class="d-grid gap-2">
        <input class="form-control" type="text" id="animal" maxlength="20">
        <button class="btn btn-diagnose" type="submit">診断する</button>
      </div>
    </form>
    <div id="result-area" class="mt-4" aria-live="polite"></div>
    <div id="tweet-area" class="mt-3"></div>
  </main>

  <script src="sinndann.js"></script>
</body>
</html>
